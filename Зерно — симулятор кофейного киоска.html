<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зерно — симулятор кофейного киоска</title>
<style>
:root{--bg:#dce6ec;--card:#f6f9fb;--ink:#1d2b33;--mut:#5d6f79;--green:#1f5a47;--gold:#e9a62b;--red:#c8442f;--board:#26332f;--chalk:#eef3ee;--line:#c3d1da;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15202a;--card:#1f2e3a;--ink:#e8eef2;--mut:#98a9b4;--green:#4fb08c;--gold:#f0b53f;--red:#ee7a64;--line:#334654;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15202a;--card:#1f2e3a;--ink:#e8eef2;--mut:#98a9b4;--green:#4fb08c;--gold:#f0b53f;--red:#ee7a64;--line:#334654;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;justify-content:space-between;align-items:baseline;font-size:17px}
.cash{font-weight:800;font-size:22px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--green);transition:width .4s}
.rep{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-top:10px}
.scene{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:14px 0;padding:16px 12px 0;border-radius:14px;background:linear-gradient(#bcd0dc,var(--bg));overflow:hidden;min-height:150px}
.kiosk{width:150px}
.sign{background:var(--green);color:#fff;text-align:center;font-weight:800;letter-spacing:.12em;padding:4px 0;border-radius:6px 6px 0 0;font-size:15px}
.awn{height:20px;background:repeating-linear-gradient(90deg,var(--green) 0 18px,#fff 18px 36px);border-radius:0 0 8px 8px}
.counter{height:84px;background:#d9b878;border:2px solid #8a6b36;border-top:0;position:relative}
.man{position:absolute;left:18px;top:6px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #1d2b33}
.mb{position:absolute;left:12px;top:30px;width:34px;height:54px;background:var(--gold);border-radius:12px 12px 0 0}
.mach{position:absolute;right:14px;top:34px;width:46px;height:34px;background:#8d9aa3;border-radius:4px}
.board{width:118px;min-height:92px;background:var(--board);color:var(--chalk);border:4px solid #8a6b36;border-bottom:0;padding:6px;font-size:15px;letter-spacing:.06em;word-break:break-all}
.board s{text-decoration-thickness:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.card p{margin:4px 0}
.mut{color:var(--mut);font-size:14px}
.err{color:var(--red);font-weight:600}
.g{color:var(--green)}
.w{margin:0;font-weight:600}
input[type=range]{width:100%;accent-color:var(--green);margin:8px 0}
.row{display:flex;gap:8px;margin-top:6px}
button{font:inherit;cursor:pointer}
button.sec{flex:1;padding:11px 10px;border-radius:10px;border:2px solid var(--green);background:transparent;color:var(--ink);font-weight:600;text-align:left}
.row button.sec{text-align:center}
button.sec.on{background:var(--green);color:#fff}
button.sec:disabled{opacity:.4;cursor:default}
.ev button.sec{display:block;width:100%;margin-top:8px}
.ev{border-color:var(--red);border-width:2px}
button.go{width:100%;padding:15px;border:0;border-radius:12px;background:var(--gold);color:#1d2b33;font-weight:800;font-size:18px;margin-top:6px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.end{text-align:center;padding:50px 0 20px}
.end h1{font-size:34px;margin:0 0 12px}
.vt{display:block;margin:0 0 4px auto;padding:4px 10px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:13px}
.scene{position:relative}
.cu{position:absolute;bottom:0;left:6px;width:16px;height:38px;border-radius:8px 8px 0 0;background:#6b8795;opacity:0;animation:walk 2.4s ease-out forwards}
.cu:nth-of-type(2n){left:-6px;background:#b08a5b}
.cu::before{content:"";position:absolute;top:-14px;left:1px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #1d2b33}
@keyframes walk{0%{transform:translateX(0);opacity:0}15%{opacity:1}100%{transform:translateX(26px);opacity:1}}
.stm{position:absolute;right:30px;top:28px;width:8px;height:8px;border-radius:50%;background:#fff;opacity:0}
.stm.s2{right:40px}
.play .stm{animation:steam 1.6s ease-out infinite}
.play .s2{animation-delay:.7s}
@keyframes steam{0%{transform:translateY(0);opacity:.8}100%{transform:translateY(-26px) scale(2);opacity:0}}
.coin{position:absolute;top:10px;left:50%;font-weight:800;color:var(--green);background:var(--card);padding:2px 10px;border-radius:12px;animation:up 1.6s ease-out forwards}
@keyframes up{0%{transform:translate(-50%,20px);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-6px);opacity:1}}
.shake{animation:shake .5s 2}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ev{animation:pop .35s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.news{border-left:5px solid var(--gold)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.cu,.stm,.coin,.shake,.ev{animation:none!important}.cu,.coin{opacity:1}}
.scene{min-height:190px;padding:30px 8px 0}
.mn{width:34px;height:68px;overflow:visible}
.win{height:62px;background:#e8f1f5;position:relative;border:2px solid #8a6b36;border-top:0;border-bottom:0;display:flex;justify-content:center;align-items:flex-end}
.win .mn{width:30px;height:60px}
.cnt{height:26px;background:#d9b878;border:2px solid #8a6b36}
.mach2{position:absolute;right:8px;bottom:0;width:30px;height:24px;background:#8d9aa3;border-radius:4px 4px 0 0}
.win .stm{right:14px;top:16px}
.win .stm.s2{right:24px}
.cs{position:absolute;bottom:0;left:-30px;opacity:0;animation:walk2 2.6s ease-out forwards}
.cs .mn{width:26px;height:52px}
@keyframes walk2{0%{transform:translateX(0);opacity:0}12%{opacity:1}75%{transform:translateX(64px);opacity:1}100%{transform:translateX(70px);opacity:0}}
.mn .bd{transform-box:fill-box;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.cs .lg{transform-box:fill-box;transform-origin:top;animation:leg .35s infinite alternate}
.cs .l2{animation-direction:alternate-reverse}
@keyframes leg{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.vis{position:absolute;right:10px;bottom:0;animation:enter .7s ease-out}
.vis .mn{width:38px;height:76px}
@keyframes enter{from{transform:translateX(70px);opacity:0}}
.bub{position:absolute;top:8px;left:10px;right:10px;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:6px 10px;font-size:13px;line-height:1.3;animation:pop .35s}
@media (prefers-reduced-motion:reduce){.cs,.vis,.bub,.mn .bd,.cs .lg{animation:none!important}.cs{opacity:1}}
.vt{display:inline-block;margin:0 0 4px 4px}
h2{margin:6px 0}
html[data-q="0"] *{animation:none!important;transition:none!important}
html[data-q="0"] .cs{display:none}
html[data-q="2"] .scene,html[data-q="3"] .scene{background:linear-gradient(#8fb9d3,#e9f1f5 72%,#b5c8a4 72%)}
html[data-q="2"] .mn,html[data-q="3"] .mn{filter:drop-shadow(0 3px 2px rgba(0,0,0,.28))}
html[data-q="2"] .kiosk,html[data-q="3"] .kiosk{filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
html[data-q="3"] .scene::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 0,rgba(255,236,170,.75),transparent 55%);pointer-events:none}
html[data-q="3"] .scene::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 44px rgba(0,0,0,.3);pointer-events:none}
html[data-d="1"] .scene{overflow:visible;transform-style:preserve-3d;transform:perspective(700px) rotateX(9deg);animation:sway 7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:perspective(700px) rotateX(9deg) rotateY(-7deg)}50%{transform:perspective(700px) rotateX(9deg) rotateY(7deg)}}
html[data-d="1"] .kiosk{transform:translateZ(40px)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.opt.on{border-color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}
.opt span{float:right;font-weight:700}
.opt small{display:block;color:var(--mut);margin-top:2px;font-size:13px}
button.go:disabled{opacity:.4;cursor:default}
#aiq{flex:1;min-width:0;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.ailog{max-height:170px;overflow:auto;font-size:14px;margin:6px 0}
.ailog p{margin:4px 0}
.ailog .me{color:var(--mut)}
</style>
</head>
<body>
<div class="wrap"><div style="text-align:right"><button class="vt" onclick="A('menu')">Меню</button> <button class="vt" id="vt" onclick="A('voice')"></button></div><div id="app"></div><div id="ai"></div></div>
<script>
var W=[{n:"Солнечно",k:1.15,p:.3},{n:"Пасмурно",k:1,p:.4},{n:"Дождь",k:.65,p:.3}];
var S;
function fmt(n){return Math.round(n).toLocaleString("ru-RU").replace(/\u00a0|\u202f/g," ")+" ₸"}
function init(){S={day:1,cash:900000,rep:11,stock:20,price:1500,ad:false,pend:false,ev:false,log:null,msg:"",phase:"plan"};newDay();render()}
function newDay(){var r=Math.random(),a=0;for(var i=0;i<W.length;i++){a+=W[i].p;if(r<a){S.w=W[i];break}}S.ad=false;S.msg="";S.phase="plan"}
function dem(){return 120*S.rep/100*Math.pow(1500/S.price,1.6)*S.w.k*(S.ad?1.3:1)}
function play(){
  var cost=0;if(S.ad&&S.cash>=40000){cost=40000;S.cash-=cost}
  var want=Math.round(dem()*(0.85+Math.random()*0.3));
  var served=Math.min(want,S.stock),lost=want-served,rev=served*S.price;
  S.cash+=rev;S.stock-=served;
  S.rep=Math.max(1,Math.min(100,S.rep+served*0.1-lost*0.05));
  S.log={want:want,served:served,lost:lost,rev:rev,cost:cost,w:S.w};
  var p=(S.day>2?0.1:0)+(served>40?0.05:0);
  if(S.pend){S.pend=false;if(Math.random()<.5)p=1}
  S.ev=Math.random()<p;S.phase="result"
}
function step(){
  if(S.day%10==0){S.cash-=300000;if(S.cash<0){S.phase="lose";return true}}
  if(S.day>=30){S.phase="win";return true}
  S.day++;return false
}
function next(){S.ev=false;if(!step())newDay()}
function fix(t){
  if(t=="full"){S.cash-=600000;next()}
  else if(t=="cheap"){S.cash-=350000;S.pend=true;next()}
  else{S.ev=false;for(var i=0;i<3;i++){if(step())return}newDay();S.msg="Киоск стоял закрытым два дня."}
}
function A(k,v){
  if(k=="buy"){var c=v*400;if(S.cash<c)S.msg="Не хватает денег на зёрна.";else{S.cash-=c;S.stock+=v;S.msg=""}}
  else if(k=="ad")S.ad=!S.ad;
  else if(k=="play")play();
  else if(k=="next")next();
  else if(k=="fix")fix(v);
  else if(k=="again"){init();return}
  render()
}
function upd(){
  var e=dem();
  document.getElementById("pv").textContent=fmt(S.price);
  document.getElementById("fc").textContent="Прогноз: "+Math.round(e*.85)+"–"+Math.round(e*1.15)+" клиентов"
}
function tally(n){var g=Math.floor(n/5);return "<s>IIII</s> ".repeat(g)+"I".repeat(n%5)}
function head(){return '<header><div><b>День '+S.day+'</b> из 30</div><div class="cash">'+fmt(S.cash)+'</div></header><div class="rep"><span>Репутация</span><b>'+Math.round(S.rep)+' из 100</b></div><div class="bar"><i style="width:'+S.rep+'%"></i></div>'}
function scene(){return '<div class="scene"><div class="kiosk"><div class="sign">ЗЕРНО</div><div class="awn"></div><div class="counter"><div class="man"></div><div class="mb"></div><div class="mach"></div></div></div><div class="board">'+(S.log&&S.phase=="result"?tally(S.log.served):"")+'</div></div>'}
function plan(){
  var left=Math.ceil(S.day/10)*10-S.day;
  return '<p class="w">'+S.w.n+'. '+(left?'Аренда 300 000 ₸ через '+left+' дн.':'Вечером аренда 300 000 ₸.')+'</p>'+
  '<div class="card"><label for="pr">Цена чашки: <b id="pv"></b></label><input id="pr" type="range" min="800" max="3000" step="100" value="'+S.price+'" oninput="S.price=+this.value;upd()"><p class="mut" id="fc"></p></div>'+
  '<div class="card"><p>Зёрна на складе: <b>'+S.stock+'</b> чашек <span class="mut">(400 ₸ за чашку)</span></p><div class="row"><button class="sec" onclick="A(\'buy\',20)">+20</button><button class="sec" onclick="A(\'buy\',50)">+50</button><button class="sec" onclick="A(\'buy\',100)">+100</button></div></div>'+
  '<div class="card"><button class="sec'+(S.ad?' on':'')+'" style="width:100%" onclick="A(\'ad\')">'+(S.ad?'Реклама включена':'Реклама: 40 000 ₸, клиентов в 1,3 раза больше')+'</button></div>'+
  (S.msg?'<p class="err">'+S.msg+'</p>':'')+
  '<button class="go" onclick="A(\'play\')">Открыть киоск</button>'
}
function result(){
  var l=S.log;
  var h='<div class="card"><p>'+l.w.n+'. Хотели кофе: <b>'+l.want+'</b>. Продано: <b>'+l.served+'</b>.'+(l.lost?' Не хватило зёрен: '+l.lost+'.':'')+'</p><p>Выручка <b class="g">+'+fmt(l.rev)+'</b>'+(l.cost?', реклама −'+fmt(l.cost):'')+'</p>'+(S.day%10==0?'<p class="err">Вечером спишется аренда: 300 000 ₸.</p>':'')+'</div>';
  if(!S.ev)return h+'<button class="go" onclick="A(\'next\')">Следующий день</button>';
  return h+'<div class="card ev"><b>Сломалась кофемашина</b><p class="mut">Без неё киоск не работает.</p>'+
  '<button class="sec"'+(S.cash<600000?' disabled':'')+' onclick="A(\'fix\',\'full\')">Починить как надо: 600 000 ₸</button>'+
  '<button class="sec"'+(S.cash<350000?' disabled':'')+' onclick="A(\'fix\',\'cheap\')">Мастер подешевле: 350 000 ₸ (может сломаться снова)</button>'+
  '<button class="sec" onclick="A(\'fix\',\'close\')">Чинить самому: бесплатно, но киоск закрыт два дня</button></div>'
}
function end(){
  var win=S.phase=="win";
  return '<div class="end"><h1>'+(win?'Месяц позади':'Аренду нечем платить')+'</h1><p>'+(win?'Касса: <b>'+fmt(S.cash)+'</b>. Репутация: '+Math.round(S.rep)+' из 100.':'Не хватило: <b>'+fmt(-S.cash)+'</b>. Дней продержался: '+S.day+'.')+'</p><p class="mut">У каждого успеха есть своя цена.</p><button class="go" onclick="A(\'again\')">Сыграть ещё раз</button></div>'
}
function render(){
  var a=document.getElementById("app");
  a.innerHTML=(S.phase=="win"||S.phase=="lose")?end():head()+scene()+(S.phase=="plan"?plan():result());
  if(S.phase=="plan")upd()
}
</script>
<script>
var V=true;
function say(t){if(!V||!window.speechSynthesis)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="ru-RU";var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.indexOf("ru")==0})[0];if(v)u.voice=v;u.rate=1.05;speechSynthesis.speak(u)}catch(e){}}
var IN={1:"День первый. Киоск Зерно открывается. О нас знают одиннадцать человек из ста.",10:"Десятый день. Скоро первая аренда.",20:"Двадцатый день. Район уже знает про Зерно.",30:"Последний день. Продержись до вечера."};
function no(m){return {l:"Отказаться",c:0,f:function(){return m}}}
var EV=[
{id:"brk",t:"Сломалась кофемашина",d:"Без неё киоск не работает.",ch:[
{l:"Починить как надо: 600 000 ₸",c:600000,f:function(){S.cash-=600000;return "Машину починили, она гудит как новая."}},
{l:"Мастер подешевле: 350 000 ₸, может сломаться снова",c:350000,f:function(){S.cash-=350000;S.pend=true;return "Починили дёшево. Мастер сказал: «Держится на честном слове»."}},
{l:"Чинить самому: бесплатно, но два дня закрыто",c:0,skip:1,f:function(){for(var i=0;i<3;i++){if(step())return ""}newDay();return "Два дня ты возился с машиной. Она снова работает."}}]},
{id:"blog",t:"Блогер у киоска",d:"Известный блогер хочет снять обзор.",ok:function(){return S.day>2},ch:[
{l:"Угостить: 20 чашек бесплатно",c:0,f:function(){S.stock-=Math.min(20,S.stock);S.rep=Math.min(100,S.rep+8);return "Блогер выложил ролик. Репутация растёт."}},
{l:"Попросить денег за рекламу",c:0,f:function(){if(Math.random()<.5){S.rep=Math.max(1,S.rep-3);return "Блогер обиделся и ушёл. Репутация упала."}S.cash+=80000;S.rep=Math.min(100,S.rep+6);return "Блогер заплатил 80 000 ₸ и снял ролик!"}}]},
{id:"san",t:"Проверка из санстанции",d:"Инспектор нашёл нарушения.",ok:function(){return S.day>3},ch:[
{l:"Заплатить штраф: 150 000 ₸",c:150000,f:function(){S.cash-=150000;return "Штраф оплачен."}},
{l:"Договориться: 60 000 ₸ (риск)",c:60000,f:function(){S.cash-=60000;if(Math.random()<.4){S.cash-=300000;S.rep=Math.max(1,S.rep-10);return "Инспектор оказался принципиальным: штраф 300 000 ₸ и скандал."}return "Договорились. Инспектор ушёл довольный."}}]},
{id:"rival",t:"Конкурент напротив",d:"Через дорогу открылась новая кофейня.",ok:function(){return S.day>4},ch:[
{l:"Снизить цену на 200 ₸",c:0,f:function(){S.price=Math.max(800,S.price-200);return "Цена снижена. Клиенты остались."}},
{l:"Ответить рекламой: 40 000 ₸",c:40000,f:function(){S.cash-=40000;S.rep=Math.min(100,S.rep+3);return "Реклама сработала, район о нас знает."}},
{l:"Не обращать внимания",c:0,f:function(){S.rep=Math.max(1,S.rep-4);return "Часть клиентов ушла через дорогу."}}]},
{id:"rent",t:"Агент по аренде",d:"Желающих много. Хозяин хочет поднять аренду.",ok:function(){return S.day>6&&S.rent==300000},ch:[
{l:"Согласиться: аренда 360 000 ₸",c:0,f:function(){S.rent=360000;return "Аренда теперь 360 000 ₸."}},
{l:"Торговаться (риск)",c:0,f:function(){if(Math.random()<.5)return "Хозяин уступил. Аренда прежняя.";S.rent=400000;return "Хозяин разозлился: аренда 400 000 ₸."}}]},
{id:"thief",t:"Подозрительный человек",d:"Ночью возле киоска кто-то крутился.",ok:function(){return S.stock>20},ch:[
{l:"Поставить замок: 30 000 ₸",c:30000,f:function(){S.cash-=30000;return "Замок поставлен. Ночь прошла спокойно."}},
{l:"Ничего не делать",c:0,f:function(){var n=Math.floor(S.stock/2);S.stock-=n;return "Утром не хватило "+n+" чашек зёрен."}}]},
{id:"corp",t:"Заказ от офиса",d:"Бизнес-центр хочет 60 чашек по 1 300 ₸ завтра.",ok:function(){return S.day>4},ch:[
